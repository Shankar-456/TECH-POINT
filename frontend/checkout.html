


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Checkout - TECH POINT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">

<style>

.checkout-container{
width:90%;
max-width:1100px;
margin:50px auto;
display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
}

/* FORM */

.checkout-form{
background:#fff;
padding:35px;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

.checkout-form h3{
margin-bottom:15px;
font-weight:600;
}

.checkout-form input{
width:100%;
padding:12px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:6px;
font-size:14px;
}

.checkout-form input:focus{
border-color:#000;
outline:none;
}



/* Payment Method Section */
.payment-method {
  margin-bottom: 25px; 
  width: 100%;
}

.payment-option {
  display: flex;
  align-items: center; 
  justify-content: flex-start; 
  gap: 10px; 
  cursor: pointer;
  width: fit-content; 
}

.payment-option input[type="radio"] {
  margin: 0; 
  width: 18px; 
  height: 18px;
  cursor: pointer;
}

.payment-option span {
  font-size: 1.05rem;
  color: #374151; 
  font-weight: 500;
  white-space: nowrap; 
}






/* BUTTON */

.place-order-btn{
width:100%;
padding:14px;
background:#000;
color:#fff;
border:none;
border-radius:6px;
font-weight:600;
cursor:pointer;
transition:0.3s;
}

.place-order-btn:hover{
background:#333;
}

/* ORDER SUMMARY */

.order-summary{
background:#fff;
padding:35px;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

.order-summary h3{
margin-bottom:20px;
}

.summary-item{
display:flex;
justify-content:space-between;
margin-bottom:10px;
font-size:14px;
}

.summary-total{
margin-top:20px;
font-size:18px;
font-weight:600;
}





/* MOBILE */

@media(max-width:900px){

.checkout-container{
grid-template-columns:1fr;
}

}




</style>
</head>

<body>


<header class="top-header">
  <div class="header-container">

    <div class="brand">
      <a href="index.html">TechPoint</a>
    </div>

    <nav class="menu">

      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="cart.html">Cart</a>

      <!-- USER -->
      <a href="profile.html" id="profileLink">Profile</a>

      <a href="help.html">Help</a>

      <!-- LOGIN -->
      <a href="login.html" id="loginLink">Login</a>

      <!-- LOGOUT -->
      <a href="#" id="logoutBtn">Logout</a>

    </nav>

  </div>
</header>

<h2 class="page-title">Checkout</h2>


<div class="checkout-container">



<div class="checkout-form">

<h3>Delivery Details</h3>

<input type="text" id="address" placeholder="Delivery Address">

<input type="text" id="mobile" placeholder="+91XXXXXXXXXX" value="+91" maxlength="13">



<h3>Payment Method</h3>

<div class="payment-method">
  <label class="payment-option">
    <input type="radio" name="payment" value="COD" checked>
    <span>Cash on Delivery</span>
  </label>
</div>


<button id="placeOrderBtn" class="place-order-btn">
Place Order
</button>

</div>



<div class="order-summary">

<h3>Order Summary</h3>

<div id="checkoutItems"></div>


</div>

</div>


<script src="js/checkout.js"></script>
<script src="js/main.js"></script>
</body>
</html>
