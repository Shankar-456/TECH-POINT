<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - TechPoint</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
<style>

body {
  margin: 0;
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #ffffff;
  color: #000;
}

/* HEADER */

.top-header {
  background: #000;
  padding: 20px 0;
}

.header-container {
  width: 90%;
  margin: auto;
}

.brand a {
  color: #fff;
  text-decoration: none;
  font-size: 24px;
  font-weight: 600;
  letter-spacing: 1px;
}

/* LOGIN SECTION */

.login-section {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 80vh;
}

.login-card {
  width: 380px;
}

.login-card h2 {
  font-size: 28px;
  margin-bottom: 30px;
  font-weight: 500;
}

/* INPUT STYLE */

.input-group {
  margin-bottom: 20px;
}

.input-group input {
  width: 100%;
  padding: 12px 5px;
  border: none;
  border-bottom: 1px solid #000;
  outline: none;
  font-size: 14px;
  background: transparent;
}

.input-group input:focus {
  border-bottom: 2px solid #000;
}

/* BUTTON */

.login-btn {
  width: 100%;
  padding: 12px;
  background: #000;
  color: #fff;
  border: none;
  cursor: pointer;
  font-size: 14px;
  letter-spacing: 1px;
  transition: 0.3s;
}

.login-btn:hover {
  background: #333;
}

/* LINK */

.link {
  margin-top: 20px;
  font-size: 14px;
}

.link a {
  color: #000;
  text-decoration: none;
  font-weight: 500;
}

.link a:hover {
  text-decoration: underline;
}

/* ERROR */

.error {
  color: red;
  font-size: 13px;
  margin-bottom: 15px;
}

</style>
</head>
<body>

<header class="top-header">
  <div class="header-container">

    <div class="brand">
      <a href="index.html">TechPoint</a>
    </div>

    <nav class="menu">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="help.html">Help</a>
      <a href="register.html">Create Account</a>
    </nav>

  </div>
</header>

<div class="login-section">
  <div class="login-card">
    <h2>Sign In</h2>

    <div id="error-msg" class="error"></div>

    <div class="input-group">
      <input type="text" id="mobile" placeholder="Mobile Number">
    </div>

    <div class="input-group">
      <input type="password" id="password" placeholder="Password">
    </div>

    <button class="login-btn" onclick="login()">LOGIN</button>

    <div class="link">
      Don't have an account?
      <a href="/register.html">Create one</a>
    </div>
  </div>
</div>

<script>
async function login() {

  const mobile = document.getElementById("mobile").value.trim();
  const password = document.getElementById("password").value.trim();
  const errorMsg = document.getElementById("error-msg");

  errorMsg.innerText = "";

  // MOBILE VALIDATION
  const mobileRegex = /^[0-9]{10}$/;

  if (!mobileRegex.test(mobile)) {
    errorMsg.innerText = "Enter a valid 10 digit mobile number";
    return;
  }

  try {

    const res = await fetch("/api/auth/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ mobile, password })
    });

    const data = await res.json();

    console.log("LOGIN RESPONSE:", data);

    if (!res.ok) {
      errorMsg.innerText = data.message || "Login failed";
      return;
    }

    localStorage.setItem("token", data.token);
    localStorage.setItem("userInfo", JSON.stringify(data.user));

    if (data.user.role === "admin") {

      window.location.href = "/admin/dashboard.html";

    } else {

      window.location.href = "/index.html";

    }

  } catch (error) {

    console.error("Login error:", error);
    errorMsg.innerText = "Server connection error";

  }

}

</script>
<script src="js/main.js"></script>
</body>
</html>
