

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile - TechPoint</title>
<link rel="stylesheet" href="css/style.css">
<style>
    /* PROFILE PAGE */

.profile-title{
text-align:center;
margin-top:40px;
font-size:28px;
letter-spacing:2px;
}

.profile-wrapper{
width:90%;
max-width:1100px;
margin:40px auto;
display:grid;
grid-template-columns:1fr 2fr;
gap:40px;
}

/* ACCOUNT CARD */

.profile-card{
border:2px solid #000;
padding:25px;
background:#fff;
}

.profile-card h2{
margin-bottom:20px;
}

.profile-card label{
font-size:13px;
margin-top:10px;
display:block;
}

.profile-card input{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid #000;
}

.profile-card button{
margin-top:20px;
width:100%;
padding:12px;
background:#000;
color:#fff;
border:none;
cursor:pointer;
}

.profile-card button:hover{
background:#333;
}


/* ORDERS */

.orders-card{
border:2px solid #000;
padding:25px;
background:#fff;
}

.orders-card h2{
margin-bottom:20px;
}


/* ORDER ITEM */

.order-item{
display:flex;
align-items:center;
gap:20px;
border-bottom:1px solid #ddd;
padding:15px 0;
}

.order-item img{
width:80px;
height:80px;
object-fit:cover;
border:1px solid #000;
}

.order-info h4{
margin:0;
font-size:16px;
}

.order-info p{
margin:3px 0;
font-size:13px;
}


/* MOBILE */

@media(max-width:768px){

.profile-wrapper{
grid-template-columns:1fr;
}

}
</style>
</head>

<body>


<header class="top-header">
  <div class="header-container">

    <div class="brand">
      <a href="index.html">TechPoint</a>
    </div>

    <nav class="menu">

      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="cart.html">Cart</a>

      <!-- USER -->
      <a href="profile.html" id="profileLink">Profile</a>

      <a href="help.html">Help</a>

      <!-- LOGIN 
      <a href="login.html" id="loginLink">Login</a>
    -->
      <!-- LOGOUT -->
      <a href="#" id="logoutBtn">Logout</a>

    </nav>

  </div>
</header>

<h1 class="profile-title">MY PROFILE</h1>

<div class="profile-wrapper">

  <!-- ACCOUNT INFO -->
  <div class="profile-card">

    <h2>Account Information</h2>

    <label>Name</label>
    <input type="text" id="profileName">

    <label>Mobile</label>
    <input type="text" id="profileMobile" disabled>

    <label>Email</label>
    <input type="email" id="profileEmail" >

    <label>New Password</label>
    <input type="password" id="profilePassword" placeholder="Leave empty if no change">

    <button id="updateProfileBtn">Update Profile</button>

  </div>

  <!-- ORDERS -->
  <div class="orders-card">

    <h2>Order History</h2>

    <div id="orderList"></div>

  </div>

</div>

<script src="js/profile.js"></script>
<script src="js/main.js"></script>
</body>
</html>
